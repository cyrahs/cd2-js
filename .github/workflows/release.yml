name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/cd2-js.user.js \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
      # 把构建产物推到 release 分支，供 GreasyFork 以 raw URL 同步（webhook 触发需要文件在仓库内）
      - name: Publish to release branch
        run: |
          cd dist
          git init -b release
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cd2-js.user.js
          git commit -m "release $GITHUB_REF_NAME"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" release
