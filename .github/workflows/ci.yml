name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 版本号由 git 提交数生成，需要完整历史
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: userscript
          path: dist/cd2-js.user.js
      # CI 通过后自动发布（版本号 = @version，来自 git 提交数）：
      # 1. 把产物提交到仓库根目录（GreasyFork 的 webhook 同步走 git 按 tag 读文件，产物必须在 git 树里）
      # 2. 对产物提交打 tag 发 release，release 事件触发 webhook 通知 GreasyFork
      # 产物与已提交版本仅 @version 行不同时跳过（文档类改动不发版）。
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f cd2-js.user.js ] && diff <(grep -v '^// @version' cd2-js.user.js) <(grep -v '^// @version' dist/cd2-js.user.js) > /dev/null; then
            # 产物无实质变化。但若已提交版本还没有对应 release（上次发布中途失败），用已提交产物补发
            VERSION=$(grep -m1 '^// @version' cd2-js.user.js | awk '{print $3}')
            if gh release view "v$VERSION" > /dev/null 2>&1; then
              echo "脚本无实质变化，跳过发布"
            else
              echo "补发 release v$VERSION"
              gh release create "v$VERSION" cd2-js.user.js \
                --target "$(git rev-parse HEAD)" \
                --title "v$VERSION" \
                --generate-notes
            fi
            exit 0
          fi
          VERSION=$(grep -m1 '^// @version' dist/cd2-js.user.js | awk '{print $3}')
          cp dist/cd2-js.user.js cd2-js.user.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cd2-js.user.js
          git commit -m "build: cd2-js.user.js v$VERSION"
          git push
          gh release create "v$VERSION" dist/cd2-js.user.js \
            --target "$(git rev-parse HEAD)" \
            --title "v$VERSION" \
            --generate-notes
