name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 版本号由 git 提交数生成，需要完整历史
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: userscript
          path: dist/cd2-js.user.js
      # CI 通过后自动发 release（版本号 = @version，来自 git 提交数）。
      # 与最新 release 资产相比只有 @version 行不同时跳过，避免文档类改动发布无意义版本。
      # release 事件会触发 webhook 通知 GreasyFork 从 releases/latest/download 同步。
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 '^// @version' dist/cd2-js.user.js | awk '{print $3}')
          if gh release download --pattern cd2-js.user.js -O previous.user.js 2>/dev/null; then
            if diff <(grep -v '^// @version' previous.user.js) <(grep -v '^// @version' dist/cd2-js.user.js) > /dev/null; then
              echo "脚本无实质变化，跳过发布"
              exit 0
            fi
          fi
          gh release create "v$VERSION" dist/cd2-js.user.js --title "v$VERSION" --generate-notes
