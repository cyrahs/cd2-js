name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 版本号由 git 提交数生成，需要完整历史
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # 把构建产物提交回仓库根目录，GreasyFork 从 raw URL 同步；
      # GITHUB_TOKEN 的推送不会再次触发工作流，但会正常触发 webhook 通知 GreasyFork
      - name: Commit built userscript
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -f cd2-js.user.js ] && diff <(grep -v '^// @version' cd2-js.user.js) <(grep -v '^// @version' dist/cd2-js.user.js) > /dev/null; then
            echo "脚本无实质变化，跳过提交"
            exit 0
          fi
          cp dist/cd2-js.user.js cd2-js.user.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cd2-js.user.js
          git commit -m "build: 更新 cd2-js.user.js"
          git push
